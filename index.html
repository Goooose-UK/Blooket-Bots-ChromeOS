<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100% not a Blooket Bot Maker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #20243a;
      background: linear-gradient(135deg, #d9f3ff, #f0e4ff);
    }

    main {
      width: min(100%, 900px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #26345a22;
    }

    h1 { margin-top: 0; }

    section + section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e8e8ef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    input, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c9cadd;
      border-radius: 10px;
      font: inherit;
    }

    button {
      margin-top: 10px;
      border: 0;
      color: white;
      background: #6654d9;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #5140c2; }

    .choices {
      display: flex;
      gap: 12px;
    }

    .choices button { width: 50%; }
    .choices button:last-child { background: #757889; }

    #result {
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    #jeff {
      display: none;
      max-width: 100%;
      max-height: 280px;
      margin-top: 14px;
      border-radius: 12px;
    }

    a { color: #5140c2; }

    .fruit-board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .fruit-tile {
      min-height: 64px;
      padding: 8px;
      border: 1px solid #e2dff2;
      border-radius: 12px;
      background: #f8f6ff;
      font-size: 28px;
      cursor: pointer;
    }

    .fruit-tile:hover { background: #eeeaff; }

    .fruit-tile.selected {
      outline: 3px solid #6654d9;
    }
  </style>
</head>

<body>
  <main>
    <h1>Blooket Bot Maker</h1>

    <section>
      <h2>Join a game</h2>
      <form id="join-form">
        <label for="code">Enter a Blooket game code</label>
        <input
          id="code"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Game code"
          required
        >
        <button type="submit">Generate join link</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <section>
      <h2>Fix my Wi-Fi</h2>
      <p>Should Jeff come fix your Wi-Fi?</p>

      <div class="choices">
        <button type="button" id="yes">Y</button>
        <button type="button" id="no">N</button>
      </div>

      <div id="wifi-result" aria-live="polite"></div>
      <img id="jeff" src="assets/jeff.png" alt="Jeff">
    </section>

    <section>
      <h2>Fruit Merge</h2>
      <p>Click two matching fruits to merge them. How big can you get?</p>
      <div id="fruit-board" class="fruit-board" aria-label="Fruit merge game"></div>
      <p id="fruit-status" aria-live="polite">Pick two matching fruits!</p>
      <button type="button" id="fruit-reset">New game</button>
    </section>
  </main>

  <script>
    const joinForm = document.querySelector("#join-form");
    const codeInput = document.querySelector("#code");
    const result = document.querySelector("#result");

    const nameStarts = [
      "ChatGPT", "DuckBot", "PixelAI", "RoboFox", "ByteBot",
      "MegaBot", "BrainAI", "BotBuddy", "SmartBot", "AIDuck",
      "CyberCat", "NeuralFox", "DataBot", "AIBear", "CodeOwl",
      "DigitalDog", "BotLlama", "TechTiger", "CloudBot", "AIWizard",
      "RoboPanda", "LogicBot", "AICat", "QuantumBot", "CyberBee",
      "ByteBuddy", "BotNinja", "AIMango", "RoboRaven", "PixelBot"
    ];

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = codeInput.value.trim();
      if (!code) return;

      const nameStart =
        nameStarts[Math.floor(Math.random() * nameStarts.length)];
      const digits = Math.floor(Math.random() * 90) + 10;
      const randomName = `${nameStart}${digits}`;

      const joinUrl = new URL("https://play.blooket.com/play");
      joinUrl.searchParams.set("id", code);

      result.replaceChildren();

      const nameText = document.createElement("p");
      nameText.textContent = `Your randomly generated name: ${randomName}`;

      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.textContent = "Copy name";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(randomName);
          copyButton.textContent = "Copied!";
        } catch {
          const tempInput = document.createElement("input");
          tempInput.value = randomName;
          tempInput.setAttribute("readonly", "");
          tempInput.style.position = "fixed";
          tempInput.style.left = "-9999px";
          document.body.appendChild(tempInput);
          tempInput.select();

          const copied = document.execCommand("copy");
          tempInput.remove();

          copyButton.textContent = copied
            ? "Copied!"
            : "Select and copy the name above";
        }
      });

      const link = document.createElement("a");
      link.href = joinUrl.toString();
      link.textContent = "Open Blooket join link";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const note = document.createElement("p");
      note.textContent =
        "Open the link, then paste your copied name into Blooket’s name field.";

      result.append(nameText, copyButton, link, note);
    });

    document.querySelector("#yes").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "OK Your wifi is fixed";
      document.querySelector("#jeff").style.display = "block";
    });

    document.querySelector("#no").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "Because you didn’t say yes to Jeff fixing your Wi-Fi, he’s broke and homeless now. He was ready to come over, solve the whole problem, and get his life back on track but you never gave him the green light. Now he’s out there with no job, no home, and no Wi-Fi to connect to. I hope you’re happy.";

      document.querySelector("#jeff").style.display = "none";
    });

    const fruitBoard = document.querySelector("#fruit-board");
    const fruitStatus = document.querySelector("#fruit-status");
    const fruitReset = document.querySelector("#fruit-reset");

    const fruitLevels = ["🍒", "🍓", "🍇", "🍊", "🍉", "🍍", "🥝"];
    let fruits = [];
    let selectedFruit = null;

    function startFruitGame() {
      fruits = Array.from(
        { length: 16 },
        () => fruitLevels[Math.floor(Math.random() * 3)]
      );
      selectedFruit = null;
      fruitStatus.textContent = "Pick two matching fruits!";
      renderFruitBoard();
    }

    function renderFruitBoard() {
      fruitBoard.replaceChildren();

      fruits.forEach((fruit, index) => {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "fruit-tile";
        tile.textContent = fruit;
        tile.setAttribute("aria-label", `Fruit: ${fruit}`);

        if (selectedFruit === index) {
          tile.classList.add("selected");
        }

        tile.addEventListener("click", () => selectFruit(index));
        fruitBoard.appendChild(tile);
      });
    }

    function selectFruit(index) {
      if (selectedFruit === null) {
        selectedFruit = index;
        fruitStatus.textContent = "Now pick another matching fruit.";
        renderFruitBoard();
        return;
      }

      const firstIndex = selectedFruit;
      selectedFruit = null;

      if (firstIndex === index) {
        fruitStatus.textContent = "Pick a different fruit tile.";
        renderFruitBoard();
        return;
      }

      if (fruits[firstIndex] !== fruits[index]) {
        fruitStatus.textContent = "Those fruits don’t match—try again!";
        renderFruitBoard();
        return;
      }

      const currentLevel = fruitLevels.indexOf(fruits[firstIndex]);

      if (currentLevel === fruitLevels.length - 1) {
        fruitStatus.textContent =
          "That’s the biggest fruit! Start a new game to play again.";
        renderFruitBoard();
        return;
      }

      fruits[firstIndex] = fruitLevels[currentLevel + 1];
      fruits[index] = fruitLevels[Math.floor(Math.random() * 3)];

      fruitStatus.textContent =
        `Nice merge! You made ${fruitLevels[currentLevel + 1]}.`;

      renderFruitBoard();
    }

    fruitReset.addEventListener("click", startFruitGame);
    startFruitGame();
  </script>
</body>
</html>
