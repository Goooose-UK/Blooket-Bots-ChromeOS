<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blooket Helper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #20243a;
      background: linear-gradient(135deg, #d9f3ff, #f0e4ff);
    }
    main {
      width: min(100%, 520px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #26345a22;
    }
    h1 { margin-top: 0; }
    section + section { margin-top: 28px; padding-top: 24px; border-top: 1px solid #e8e8ef; }
    label { display: block; margin-bottom: 8px; font-weight: 650; }
    input, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c9cadd;
      border-radius: 10px;
      font: inherit;
    }
    button {
      margin-top: 10px;
      border: 0;
      color: white;
      background: #6654d9;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #5140c2; }
    .choices { display: flex; gap: 12px; }
    .choices button { width: 50%; }
    .choices button:last-child { background: #757889; }
    #result { margin-top: 14px; overflow-wrap: anywhere; }
    #jeff { display: none; max-width: 100%; max-height: 280px; margin-top: 14px; border-radius: 12px; }
    a { color: #5140c2; }
  </style>
</head>
<body>
  <main>
    <h1>Blooket Helper</h1>

    <section>
      <h2>Join a game</h2>
      <form id="join-form">
        <label for="code">Enter a Blooket game code</label>
        <input id="code" inputmode="numeric" autocomplete="off" placeholder="Game code" required>
        <button type="submit">Get join link</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <section>
      <h2>Fix my Wi-Fi</h2>
      <p>Should Jeff come fix your Wi-Fi?</p>
      <div class="choices">
        <button type="button" id="yes">Y</button>
        <button type="button" id="no">N</button>
      </div>
      <div id="wifi-result" aria-live="polite"></div>
      <img id="jeff" src="assets/jeff.png" alt="Jeff">
    </section>
  </main>

  <script>
    const joinForm = document.querySelector("#join-form");
    const codeInput = document.querySelector("#code");
    const result = document.querySelector("#result");

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const code = codeInput.value.trim();

      if (!code) return;

      const url = `https://play.blooket.com/play?id=${encodeURIComponent(code)}`;
      result.replaceChildren();

      const link = document.createElement("a");
      link.href = url;
      link.textContent = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      result.append("Your join link: ", link);
    });

    document.querySelector("#yes").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent = "OK Your wifi is fixed";
      document.querySelector("#jeff").style.display = "block";
    });

    document.querySelector("#no").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "Because you didn’t say yes to Jeff fixing your Wi-Fi, he’s broke and homeless now. He was ready to come over, solve the whole problem, and get his life back on track but you never gave him the green light. Now he’s out there with no job, no home, and no Wi-Fi to connect to. I hope you’re happy.";
      document.querySelector("#jeff").style.display = "none";
    });
  </script>
</body>
</html>
