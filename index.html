<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100% not a Blooket Bot Maker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #20243a;
      background: linear-gradient(135deg, #d9f3ff, #f0e4ff);
    }

    main {
      width: min(100%, 900px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #26345a22;
    }

    h1 { margin-top: 0; }

    section + section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e8e8ef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    input, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c9cadd;
      border-radius: 10px;
      font: inherit;
    }

    button {
      margin-top: 10px;
      border: 0;
      color: white;
      background: #6654d9;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #5140c2; }

    .choices {
      display: flex;
      gap: 12px;
    }

    .choices button { width: 50%; }
    .choices button:last-child { background: #757889; }

    #result {
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    #jeff {
      display: none;
      max-width: 100%;
      max-height: 280px;
      margin-top: 14px;
      border-radius: 12px;
    }

    a { color: #5140c2; }

    #fruit-next {
      text-align: center;
      font-weight: 650;
    }

    .fruit-board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 4px;
      width: min(100%, 360px);
      margin: 14px auto;
      padding: 6px;
      border: 3px solid #8675dc;
      border-radius: 12px;
      background: #eeeaff;
    }

    .fruit-cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #ddd8f3;
      border-radius: 8px;
      background: white;
      font-size: clamp(18px, 5vw, 30px);
      cursor: pointer;
    }

    .fruit-cell:hover { background: #f5f2ff; }
    .fruit-cell:disabled { cursor: default; }
  </style>
</head>

<body>
  <main>
    <h1>Blooket Bot Maker</h1>

    <section>
      <h2>Join a game</h2>
      <form id="join-form">
        <label for="code">Enter a Blooket game code</label>
        <input
          id="code"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Game code"
          required
        >
        <button type="submit">Generate join link</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <section>
      <h2>Fix my Wi-Fi</h2>
      <p>Should Jeff come fix your Wi-Fi?</p>

      <div class="choices">
        <button type="button" id="yes">Y</button>
        <button type="button" id="no">N</button>
      </div>

      <div id="wifi-result" aria-live="polite"></div>
      <img id="jeff" src="assets/jeff.png" alt="Jeff">
    </section>

    <section>
      <h2>Fruit Merge</h2>
      <p>Choose a column to drop the next fruit. Matching fruits that touch merge!</p>
      <div id="fruit-next" aria-live="polite"></div>
      <div id="fruit-board" class="fruit-board" aria-label="Fruit merge game"></div>
      <p id="fruit-status" aria-live="polite">Your turn!</p>
      <button type="button" id="fruit-reset">New game</button>
    </section>
  </main>

  <script>
    const joinForm = document.querySelector("#join-form");
    const codeInput = document.querySelector("#code");
    const result = document.querySelector("#result");

    const nameStarts = [
      "ChatGPT", "DuckBot", "PixelAI", "RoboFox", "ByteBot",
      "MegaBot", "BrainAI", "BotBuddy", "SmartBot", "AIDuck",
      "CyberCat", "NeuralFox", "DataBot", "AIBear", "CodeOwl",
      "DigitalDog", "BotLlama", "TechTiger", "CloudBot", "AIWizard",
      "RoboPanda", "LogicBot", "AICat", "QuantumBot", "CyberBee",
      "ByteBuddy", "BotNinja", "AIMango", "RoboRaven", "PixelBot"
    ];

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = codeInput.value.trim();
      if (!code) return;

      const nameStart =
        nameStarts[Math.floor(Math.random() * nameStarts.length)];
      const digits = Math.floor(Math.random() * 90) + 10;
      const randomName = `${nameStart}${digits}`;

      const joinUrl = new URL("https://play.blooket.com/play");
      joinUrl.searchParams.set("id", code);

      result.replaceChildren();

      const nameText = document.createElement("p");
      nameText.textContent = `Your randomly generated name: ${randomName}`;

      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.textContent = "Copy name";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(randomName);
          copyButton.textContent = "Copied!";
        } catch {
          const tempInput = document.createElement("input");
          tempInput.value = randomName;
          tempInput.setAttribute("readonly", "");
          tempInput.style.position = "fixed";
          tempInput.style.left = "-9999px";
          document.body.appendChild(tempInput);
          tempInput.select();

          const copied = document.execCommand("copy");
          tempInput.remove();

          copyButton.textContent = copied
            ? "Copied!"
            : "Select and copy the name above";
        }
      });

      const link = document.createElement("a");
      link.href = joinUrl.toString();
      link.textContent = "Open Blooket join link";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const note = document.createElement("p");
      note.textContent =
        "Open the link, then paste your copied name into Blooket’s name field.";

      result.append(nameText, copyButton, link, note);
    });

    document.querySelector("#yes").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "OK Your wifi is fixed";
      document.querySelector("#jeff").style.display = "block";
    });

    document.querySelector("#no").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "Because you didn’t say yes to Jeff fixing your Wi-Fi, he’s broke and homeless now. He was ready to come over, solve the whole problem, and get his life back on track but you never gave him the green light. Now he’s out there with no job, no home, and no Wi-Fi to connect to. I hope you’re happy.";

      document.querySelector("#jeff").style.display = "none";
    });

    const fruitBoard = document.querySelector("#fruit-board");
    const fruitStatus = document.querySelector("#fruit-status");
    const fruitNext = document.querySelector("#fruit-next");
    const fruitReset = document.querySelector("#fruit-reset");

    const fruitLevels = ["🍒", "🍓", "🍇", "🍊", "🍎", "🍐", "🍉", "🍍"];
    const columns = 6;
    const rows = 8;

    let fruits = [];
    let nextFruit;
    let gameOver = false;

    function randomSmallFruit() {
      return Math.floor(Math.random() * 3);
    }

    function startFruitGame() {
      fruits = Array(rows * columns).fill(null);
      nextFruit = randomSmallFruit();
      gameOver = false;
      fruitStatus.textContent = "Your turn! Choose a column.";
      renderFruitBoard();
    }

    function renderFruitBoard() {
      fruitBoard.replaceChildren();
      fruitNext.textContent = `Next fruit: ${fruitLevels[nextFruit]}`;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < columns; col++) {
          const index = row * columns + col;
          const cell = document.createElement("button");

          cell.type = "button";
          cell.className = "fruit-cell";
          cell.textContent = fruits[index] === null
            ? ""
            : fruitLevels[fruits[index]];
          cell.setAttribute(
            "aria-label",
            fruits[index] === null
              ? `Drop fruit in column ${col + 1}`
              : `${fruitLevels[fruits[index]]} in column ${col + 1}`
          );
          cell.disabled = gameOver;
          cell.addEventListener("click", () => dropFruit(col));

          fruitBoard.appendChild(cell);
        }
      }
    }

    function dropFruit(col) {
      if (gameOver) return;

      let row = rows - 1;
      while (row >= 0 && fruits[row * columns + col] !== null) {
        row--;
      }

      if (row < 0) {
        fruitStatus.textContent = "That column is full—choose another.";
        return;
      }

      const index = row * columns + col;
      fruits[index] = nextFruit;

      mergeNearby(index);
      nextFruit = randomSmallFruit();

      if (fruits.slice(0, columns).some(fruit => fruit !== null)) {
        gameOver = true;
        fruitStatus.textContent = "Game over! Press New game to play again.";
      } else if (!fruitStatus.textContent.startsWith("Merge!")) {
        fruitStatus.textContent = "Your turn! Choose a column.";
      }

      renderFruitBoard();
    }

    function mergeNearby(startIndex) {
      const queue = [startIndex];

      while (queue.length > 0) {
        const index = queue.shift();
        const level = fruits[index];

        if (level === null || level >= fruitLevels.length - 1) continue;

        const row = Math.floor(index / columns);
        const col = index % columns;

        const neighbors = [
          [row - 1, col],
          [row + 1, col],
          [row, col - 1],
          [row, col + 1]
        ];

        const match = neighbors.find(([nextRow, nextCol]) =>
          nextRow >= 0 &&
          nextRow < rows &&
          nextCol >= 0 &&
          nextCol < columns &&
          fruits[nextRow * columns + nextCol] === level
        );

        if (match) {
          const [matchRow, matchCol] = match;
          const matchIndex = matchRow * columns + matchCol;

          fruits[index] = null;
          fruits[matchIndex] = level + 1;

          fruitStatus.textContent = `Merge! You made ${fruitLevels[level + 1]}.`;
          queue.push(matchIndex);
        }
      }
    }

    fruitReset.addEventListener("click", startFruitGame);
    startFruitGame();
  </script>
</body>
</html>
