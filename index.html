<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>100% not a Blooket Bot Maker</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #20243a;
      background: linear-gradient(135deg, #d9f3ff, #f0e4ff);
    }

    main {
      width: min(100%, 900px);
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 40px #26345a22;
    }

    h1 { margin-top: 0; }

    section + section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e8e8ef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 650;
    }

    input, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #c9cadd;
      border-radius: 10px;
      font: inherit;
    }

    button {
      margin-top: 10px;
      border: 0;
      color: white;
      background: #6654d9;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #5140c2; }

    .choices {
      display: flex;
      gap: 12px;
    }

    .choices button { width: 50%; }
    .choices button:last-child { background: #757889; }

    #result {
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    #jeff {
      display: none;
      max-width: 100%;
      max-height: 280px;
      margin-top: 14px;
      border-radius: 12px;
    }

    a { color: #5140c2; }

    .fruit-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #fruit-next {
      font-size: 1.1rem;
      font-weight: 650;
    }

    #fruit-reset {
      width: auto;
      margin: 0 0 0 auto;
    }

    #fruit-canvas {
      display: block;
      width: min(100%, 420px);
      height: auto;
      margin: 14px auto;
      border: 3px solid #8675dc;
      border-radius: 14px;
      background: #f5f2ff;
      touch-action: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>Blooket Bot Maker</h1>

    <section>
      <h2>Join a game</h2>
      <form id="join-form">
        <label for="code">Enter a Blooket game code</label>
        <input
          id="code"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Game code"
          required
        >
        <button type="submit">Generate join link</button>
      </form>
      <div id="result" aria-live="polite"></div>
    </section>

    <section>
      <h2>Fix my Wi-Fi</h2>
      <p>Should Jeff come fix your Wi-Fi?</p>

      <div class="choices">
        <button type="button" id="yes">Y</button>
        <button type="button" id="no">N</button>
      </div>

      <div id="wifi-result" aria-live="polite"></div>
      <img id="jeff" src="assets/jeff.png" alt="Jeff">
    </section>

    <section>
      <h2>Fruit Merge</h2>
      <p>Move your pointer to aim, then click or tap to drop a fruit. Matching fruits merge!</p>

      <div class="fruit-controls">
        <div id="fruit-next" aria-live="polite">Loading game…</div>
        <button type="button" id="fruit-reset">New game</button>
      </div>

      <canvas
        id="fruit-canvas"
        width="420"
        height="560"
        aria-label="Physics fruit merge game"
      ></canvas>
      <p id="fruit-status" aria-live="polite">Aim and click or tap to drop a fruit.</p>
    </section>
  </main>

  <script>
    // Random AI-style names and Blooket join link
    const joinForm = document.querySelector("#join-form");
    const codeInput = document.querySelector("#code");
    const result = document.querySelector("#result");

    const nameStarts = [
      "ChatGPT", "DuckBot", "PixelAI", "RoboFox", "ByteBot",
      "MegaBot", "BrainAI", "BotBuddy", "SmartBot", "AIDuck",
      "CyberCat", "NeuralFox", "DataBot", "AIBear", "CodeOwl",
      "DigitalDog", "BotLlama", "TechTiger", "CloudBot", "AIWizard",
      "RoboPanda", "LogicBot", "AICat", "QuantumBot", "CyberBee",
      "ByteBuddy", "BotNinja", "AIMango", "RoboRaven", "PixelBot"
    ];

    joinForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = codeInput.value.trim();
      if (!code) return;

      const nameStart =
        nameStarts[Math.floor(Math.random() * nameStarts.length)];
      const digits = Math.floor(Math.random() * 90) + 10;
      const randomName = `${nameStart}${digits}`;

      const joinUrl = new URL("https://play.blooket.com/play");
      joinUrl.searchParams.set("id", code);

      result.replaceChildren();

      const nameText = document.createElement("p");
      nameText.textContent = `Your randomly generated name: ${randomName}`;

      const copyButton = document.createElement("button");
      copyButton.type = "button";
      copyButton.textContent = "Copy name";

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(randomName);
          copyButton.textContent = "Copied!";
        } catch {
          const tempInput = document.createElement("input");
          tempInput.value = randomName;
          tempInput.setAttribute("readonly", "");
          tempInput.style.position = "fixed";
          tempInput.style.left = "-9999px";
          document.body.appendChild(tempInput);
          tempInput.select();

          const copied = document.execCommand("copy");
          tempInput.remove();

          copyButton.textContent = copied
            ? "Copied!"
            : "Select and copy the name above";
        }
      });

      const link = document.createElement("a");
      link.href = joinUrl.toString();
      link.textContent = "Open Blooket join link";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const note = document.createElement("p");
      note.textContent =
        "Open the link, then paste your copied name into Blooket’s name field.";

      result.append(nameText, copyButton, link, note);
    });

    // Wi-Fi joke buttons
    document.querySelector("#yes").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "OK Your wifi is fixed";
      document.querySelector("#jeff").style.display = "block";
    });

    document.querySelector("#no").addEventListener("click", () => {
      document.querySelector("#wifi-result").textContent =
        "Because you didn’t say yes to Jeff fixing your Wi-Fi, he’s broke and homeless now. He was ready to come over, solve the whole problem, and get his life back on track but you never gave him the green light. Now he’s out there with no job, no home, and no Wi-Fi to connect to. I hope you’re happy.";

      document.querySelector("#jeff").style.display = "none";
    });

    // Standalone fruit game physics; no external libraries required.
    const canvas = document.querySelector("#fruit-canvas");
    const ctx = canvas.getContext("2d");
    const fruitStatus = document.querySelector("#fruit-status");
    const fruitNextDisplay = document.querySelector("#fruit-next");
    const fruitReset = document.querySelector("#fruit-reset");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const WALL = 12;
    const GRAVITY = 1000;
    const WALL_BOUNCE = 0.22;
    const FRUIT_BOUNCE = 0.12;
    const FRICTION = 0.985;

    const fruitTypes = [
      { emoji: "🍒", radius: 14, color: "#ef4444" },
      { emoji: "🍓", radius: 19, color: "#f43f5e" },
      { emoji: "🍇", radius: 24, color: "#8b5cf6" },
      { emoji: "🍊", radius: 29, color: "#fb923c" },
      { emoji: "🍎", radius: 34, color: "#dc2626" },
      { emoji: "🍐", radius: 39, color: "#a3c943" },
      { emoji: "🍉", radius: 45, color: "#22c55e" },
      { emoji: "🍍", radius: 51, color: "#eab308" }
    ];

    let fruits = [];
    let nextType = 0;
    let aimX = WIDTH / 2;
    let canDrop = true;
    let gameOver = false;
    let lastFrameTime = 0;
    let mergeLock = 0;

    function randomNextType() {
      return Math.floor(Math.random() * 3);
    }

    function updateNextFruit() {
      fruitNextDisplay.textContent = `Next fruit: ${fruitTypes[nextType].emoji}`;
    }

    function resetFruitGame() {
      fruits = [];
      nextType = randomNextType();
      aimX = WIDTH / 2;
      canDrop = true;
      gameOver = false;
      mergeLock = 0;
      fruitStatus.textContent = "Aim and click or tap to drop a fruit.";
      updateNextFruit();
      drawGame();
    }

    function getPointerX(event) {
      const rect = canvas.getBoundingClientRect();
      return (event.clientX - rect.left) * (WIDTH / rect.width);
    }

    canvas.addEventListener("pointermove", (event) => {
      aimX = getPointerX(event);
    });

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      aimX = getPointerX(event);
      dropFruit();
    });

    fruitReset.addEventListener("click", resetFruitGame);

    function dropFruit() {
      if (!canDrop || gameOver) return;

      const type = nextType;
      const radius = fruitTypes[type].radius;
      const x = Math.max(
        WALL + radius,
        Math.min(WIDTH - WALL - radius, aimX)
      );

      fruits.push({
        x,
        y: 48,
        vx: 0,
        vy: 0,
        angle: 0,
        spin: 0,
        radius,
        type,
        settled: false,
        dropTimer: 0
      });

      canDrop = false;
      nextType = randomNextType();
      updateNextFruit();
      fruitStatus.textContent = "Fruit dropped!";
    }

    function mergeFruits() {
      if (mergeLock > 0) return;

      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.type >= fruitTypes.length - 1) continue;

        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (a.type !== b.type) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const distance = Math.hypot(dx, dy);
          const targetDistance = a.radius + b.radius;

          if (distance > targetDistance + 1) continue;

          const newType = a.type + 1;
          const newRadius = fruitTypes[newType].radius;

          const newFruit = {
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2,
            vx: (a.vx + b.vx) * 0.35,
            vy: Math.min((a.vy + b.vy) * 0.2 - 90, -45),
            angle: (a.angle + b.angle) / 2,
            spin: (a.spin + b.spin) * 0.5,
            radius: newRadius,
            type: newType,
            settled: false,
            dropTimer: 0
          };

          fruits.splice(j, 1);
          fruits.splice(i, 1);
          fruits.push(newFruit);

          mergeLock = 0.12;
          fruitStatus.textContent =
            `Nice merge! You made ${fruitTypes[newType].emoji}.`;
          return;
        }
      }
    }

    function resolveCollisions() {
      // Repeat a few passes so stacked fruits settle smoothly.
      for (let pass = 0; pass < 3; pass++) {
        for (let i = 0; i < fruits.length; i++) {
          const a = fruits[i];

          for (let j = i + 1; j < fruits.length; j++) {
            const b = fruits[j];
            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let distance = Math.hypot(dx, dy);
            const minDistance = a.radius + b.radius;

            if (distance >= minDistance) continue;
            if (distance === 0) {
              dx = 0.01;
              distance = 0.01;
            }

            const nx = dx / distance;
            const ny = dy / distance;
            const overlap = minDistance - distance;

            // Push both fruits apart according to their masses.
            const massA = a.radius * a.radius;
            const massB = b.radius * b.radius;
            const shareA = massB / (massA + massB);
            const shareB = massA / (massA + massB);

            a.x -= nx * overlap * shareA;
            a.y -= ny * overlap * shareA;
            b.x += nx * overlap * shareB;
            b.y += ny * overlap * shareB;

            const relativeVx = b.vx - a.vx;
            const relativeVy = b.vy - a.vy;
            const velocityAlongNormal = relativeVx * nx + relativeVy * ny;

            if (velocityAlongNormal < 0) {
              const restitution = FRUIT_BOUNCE;
              const impulse = -(1 + restitution) * velocityAlongNormal / 2;
              const impulseX = impulse * nx;
              const impulseY = impulse * ny;

              a.vx -= impulseX;
              a.vy -= impulseY;
              b.vx += impulseX;
              b.vy += impulseY;

              // Add a little sideways roll at contact.
              const tangentX = -ny;
              const tangentY = nx;
              const tangentSpeed = relativeVx * tangentX + relativeVy * tangentY;
              const roll = tangentSpeed * 0.006;

              a.spin -= roll;
              b.spin += roll;
            }
          }
        }
      }
    }

    function updatePhysics(dt) {
      mergeLock = Math.max(0, mergeLock - dt);

      for (const fruit of fruits) {
        fruit.dropTimer += dt;
        fruit.vy += GRAVITY * dt;

        fruit.x += fruit.vx * dt;
        fruit.y += fruit.vy * dt;
        fruit.angle += fruit.spin * dt;

        fruit.vx *= Math.pow(FRICTION, dt * 60);
        fruit.spin *= Math.pow(0.96, dt * 60);

        const left = WALL + fruit.radius;
        const right = WIDTH - WALL - fruit.radius;
        const floor = HEIGHT - WALL - fruit.radius;

        if (fruit.x < left) {
          fruit.x = left;
          fruit.vx = Math.abs(fruit.vx) * WALL_BOUNCE;
          fruit.spin += fruit.vy * 0.002;
        } else if (fruit.x > right) {
          fruit.x = right;
          fruit.vx = -Math.abs(fruit.vx) * WALL_BOUNCE;
          fruit.spin -= fruit.vy * 0.002;
        }

        if (fruit.y > floor) {
          fruit.y = floor;
          if (fruit.vy > 20) fruit.vy = -fruit.vy * WALL_BOUNCE;
          else fruit.vy = 0;

          fruit.vx *= 0.94;
          fruit.spin *= 0.8;
        } else {
          fruit.settled = false;
        }

        if (Math.abs(fruit.vy) < 18 && Math.abs(fruit.vx) < 8) {
          fruit.settled = true;
        }
      }

      resolveCollisions();

      // Keep fruits inside the container after collision resolution.
      for (const fruit of fruits) {
        fruit.x = Math.max(
          WALL + fruit.radius,
          Math.min(WIDTH - WALL - fruit.radius, fruit.x)
        );
        fruit.y = Math.min(HEIGHT - WALL - fruit.radius, fruit.y);
      }

      mergeFruits();

      if (!canDrop && !gameOver) {
        const newestFruit = fruits[fruits.length - 1];
        if (!newestFruit || newestFruit.dropTimer > 0.3 && newestFruit.settled) {
          canDrop = true;
          fruitStatus.textContent = "Aim and click or tap to drop another fruit.";
        }

        // Do not trap the player if the fruit is still rolling.
        if (newestFruit && newestFruit.dropTimer > 1.1) {
          canDrop = true;
          fruitStatus.textContent = "Aim and click or tap to drop another fruit.";
        }
      }

      // Game over if fruit stays in the danger zone at the top.
      const dangerFruit = fruits.some(fruit => fruit.y - fruit.radius < 20);
      if (dangerFruit && fruits.length > 7) {
        gameOver = true;
        canDrop = false;
        fruitStatus.textContent = "Game over! Press New game to play again.";
      }
    }

    function drawFruit(fruit) {
      ctx.save();
      ctx.translate(fruit.x, fruit.y);
      ctx.rotate(fruit.angle);

      const { radius, type } = fruit;
      const light = fruitTypes[type].color;

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = light;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.font = `${radius * 1.45}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(fruitTypes[type].emoji, 0, 1);

      ctx.restore();
    }

    function drawGame() {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = "#f5f2ff";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Aim guide and preview fruit.
      if (canDrop && !gameOver) {
        const radius = fruitTypes[nextType].radius;
        const x = Math.max(
          WALL + radius,
          Math.min(WIDTH - WALL - radius, aimX)
        );

        ctx.save();
        ctx.setLineDash([5, 6]);
        ctx.strokeStyle = "#a99de4";
        ctx.beginPath();
        ctx.moveTo(x, 25);
        ctx.lineTo(x, HEIGHT - WALL);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.globalAlpha = 0.65;
        ctx.font = `${radius * 1.45}px system-ui, sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(fruitTypes[nextType].emoji, x, 48);
        ctx.restore();
      }

      for (const fruit of fruits) {
        drawFruit(fruit);
      }

      if (gameOver) {
        ctx.fillStyle = "#20243acc";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "white";
        ctx.font = "bold 28px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("Game Over", WIDTH / 2, HEIGHT / 2);
      }
    }

    function animate(time) {
      const dt = lastFrameTime
        ? Math.min((time - lastFrameTime) / 1000, 0.032)
        : 1 / 60;

      lastFrameTime = time;

      if (!gameOver) {
        // Substeps make collisions smoother and less likely to overlap.
        const substeps = 2;
        for (let i = 0; i < substeps; i++) {
          updatePhysics(dt / substeps);
        }
      }

      drawGame();
      requestAnimationFrame(animate);
    }

    resetFruitGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
